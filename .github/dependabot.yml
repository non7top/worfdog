version: 2
updates:
  # "chore" keeps bumps valid as conventional commits without cutting a
  # release for each one; a human decides when a bump deserves a release.
  # Update Go dependencies (go.mod / go.sum)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      go-modules:
        patterns:
          - "*"

  # Update GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"

  # Update pre-commit hooks (.pre-commit-config.yaml)
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      pre-commit:
        patterns:
          - "*"
