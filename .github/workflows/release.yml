name: Build and Release

on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build and attach assets to, e.g. v0.4.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # release-please tags with GITHUB_TOKEN, which doesn't trigger push:tags
  # workflows, so run after it instead and look for a tag on its commit.
  find-tag:
    name: Find release tag
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find_tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find a release tag on this commit
        id: find_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: find-tag
    if: needs.find-tag.outputs.tag != ''
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ needs.find-tag.outputs.tag }}
      ref: refs/tags/${{ needs.find-tag.outputs.tag }}

  publish:
    name: Publish release assets
    needs: [find-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: worfdog-${{ needs.find-tag.outputs.tag }}
          path: ./artifacts

      - name: Download DEB artifact
        uses: actions/download-artifact@v8
        with:
          name: worfdog-deb-${{ needs.find-tag.outputs.tag }}
          path: ./artifacts

      # release-please already created the release and notes; this only attaches files.
      - name: Attach assets to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.find-tag.outputs.tag }}
          files: |
            ./artifacts/worfdog
            ./artifacts/worfdog_*.deb
